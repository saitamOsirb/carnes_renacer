name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/db?connection_limit=2
      WEBPAY_ENV: integration
      WEBPAY_COMMERCE_CODE: "597055555532"
      WEBPAY_API_KEY_SECRET: test-secret-at-least-16-characters
      CSRF_SECRET: test-csrf-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
